# Theme-neutral Starship prompt layout. apply-theme.sh appends the selected
# semantic palette and atomically writes the result to ~/.config/starship.toml.

add_newline = true
palette = "theme"

format = """
$python$directory$git_branch
 $character"""

[fill]
symbol = '-'
style = ''

[character]
success_symbol = "[ ](bold fg:foreground)"
error_symbol = "[ ](bold fg:error)"

[package]
disabled = true

[git_branch]
style = "bg:surface"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:surface)[$symbol $branch(:$remote_branch)](fg:on_surface bg:surface)[ ](bold fg:surface)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold error)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](success)'
renamed = " ✍️ "
deleted = " 🗑 "

[python]
format = '[](bold warning)[${symbol}(\($virtualenv\))](fg:on_accent bg:warning)[ ](bold warning)'
version_format = ''
symbol = ' '
style = 'bold warning'

[hostname]
ssh_only = false
format = "[•$hostname](bg:surface bold fg:on_surface)[](bold fg:surface)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = true

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed success"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:surface fg:on_surface"
style_root = "error bold"
format = "[](bold fg:surface)[$user](accent)"
disabled = false
show_always = true

[directory]
home_symbol = "~"
read_only = "  "
style = "bg:default_accent fg:on_accent"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold default_accent)[$path](fg:on_accent bg:default_accent)[](bold default_accent)'

[directory.substitutions]
"Desktop" = "Desktop  "
"Documents" = "Documents  "
"Downloads" = "Downloads  "
"Music" = "Music 󰎈 "
"Pictures" = "Pictures  "
"Videos" = "Videos  "
"GitHub" = "GitHub 󰊤 "

[cmd_duration]
disabled = true
min_time = 0
format = '[](bold fg:surface)[󰪢 $duration](bold bg:surface fg:on_surface)[](bold fg:surface)'
